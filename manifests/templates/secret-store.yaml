apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: woodpecker
spec:
  provider:
    vault:
      server: http://k8s-openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: woodpecker
          serviceAccountRef:
            name: woodpecker-server
