apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-zot-pull-secret
  namespace: woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: woodpecker-zot-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.morrisons.site":{"username":"ci","password":"{{ "{{" }} .password {{ "}}" }}","auth":"{{ "{{" }} printf "ci:%s" .password | b64enc {{ "}}" }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: homelab/woodpecker
        property: ZOT_CI_PASSWORD
