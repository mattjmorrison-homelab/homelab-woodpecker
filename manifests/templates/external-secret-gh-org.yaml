apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gh-org-github-token
  namespace: woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: gh-org-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: homelab/gh-org
        property: github_token
